<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Finanzas Ahorro</title>

  <!-- ✅ Bootstrap y jQuery -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <!-- ✅ FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- ✅ AngularJS -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-resource.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.29/angular-ui-router.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/2.5.6/ui-bootstrap-tpls.min.js"></script>

  <!-- ✅ Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ✅ SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- ✅ App principal -->
  <script src="app.js"></script>

  <!-- ✅ ESTILOS CENTRALIZADOS - IMPORTANTE: Solo una referencia -->
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body ng-cloak>

  <!-- ===== NAVBAR SUPERIOR ===== -->
  <nav class="navbar navbar-fixed-top" id="topbar" ng-show="mostrarLayout">
    <div class="container-fluid">
      <button class="btn" id="toggleBtn" title="Menú">
        <i class="fa fa-bars"></i>
      </button>
      <a class="navbar-brand" href="#">
        💰 Finanzas Ahorro
      </a>
      <button class="btn btn-logout" ng-click="logout()" ng-if="mostrarLayout">
        <i class="fa fa-sign-out"></i> Salir
      </button>
    </div>
  </nav>

  <!-- ===== SIDEBAR LATERAL ===== -->
  <div class="sidebar" id="sidebar" ng-show="mostrarLayout">
    <a ui-sref="principal" 
       data-tooltip="Inicio"
       ng-class="{active: $state.includes('principal')}">
      <i class="fa fa-home"></i> 
      <span>Inicio</span>
    </a>
    
    <a ui-sref="ahorro" 
       data-tooltip="Control Ahorro-Gastos"
       ng-class="{active: $state.includes('ahorro')}">
      <i class="fa fa-line-chart"></i> 
      <span>Control Ahorro-Gastos</span>
    </a>
    
    <a ui-sref="propietario" 
       data-tooltip="Propietarios y Cuentas"
       ng-class="{active: $state.includes('propietario')}">
      <i class="fa fa-users"></i> 
      <span>Propietarios y Cuentas</span>
    </a>
    
    <a ui-sref="ubicacion_dinero" 
       data-tooltip="Ubicación del dinero"
       ng-class="{active: $state.includes('ubicacion_dinero')}">
      <i class="fa fa-map-marker"></i> 
      <span>Ubicación del dinero</span>
    </a>
    
    <a ui-sref="control_deuda" 
       data-tooltip="Control de deudas"
       ng-class="{active: $state.includes('control_deuda')}">
      <i class="fa fa-credit-card"></i> 
      <span>Control de deudas</span>
    </a>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="content" id="content">
    <div ui-view></div>
  </div>

  <!-- ===== Script para colapsar sidebar ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById("toggleBtn");
      const sidebar = document.getElementById("sidebar");
      const content = document.querySelector(".content");
      
      if (toggleBtn && sidebar && content) {
        toggleBtn.addEventListener("click", function () {
          if (window.innerWidth <= 768) {
            sidebar.classList.toggle("mobile-open");
          } else {
            sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed");
          }
          
          const icon = this.querySelector('.fa');
          icon.style.transform = sidebar.classList.contains('collapsed') || 
                                 sidebar.classList.contains('mobile-open') 
                                 ? 'rotate(90deg)' : 'rotate(0deg)';
        });

        document.addEventListener('click', function(event) {
          if (window.innerWidth <= 768) {
            const isClickInside = sidebar.contains(event.target) || 
                                 toggleBtn.contains(event.target);
            
            if (!isClickInside && sidebar.classList.contains('mobile-open')) {
              sidebar.classList.remove('mobile-open');
            }
          }
        });
      }

      // Configuración global de Chart.js
      if (typeof Chart !== 'undefined') {
        Chart.defaults.font.family = "'Inter', 'Segoe UI', 'Roboto', sans-serif";
        Chart.defaults.color = '#6b7280';
      }
    });
  </script>

  <!-- ===== Controllers ===== -->
  <script src="controllers/principalCtrl.js"></script>
  <script src="controllers/ubicacionDineroCtrl.js"></script>
  <script src="controllers/propietarioCtrl.js"></script>
  <script src="controllers/propietarioUnicoCtrl.js"></script>
  <script src="controllers/dondeAhorrarCtrl.js"></script>
  <script src="controllers/ahorroCtrl.js"></script>
  <script src="controllers/controlDeudaCtrl.js"></script>
  <script src="controllers/loginCtrl.js"></script>
  <script src="controllers/registerCtrl.js"></script>

  <!-- ===== Services / Factories ===== -->
  <script src="services/ubicacionDineroFactory.js"></script>
  <script src="services/categoriaFactory.js"></script>
  <script src="services/propietarioFactory.js"></script>
  <script src="services/propietarioUnicoFactory.js"></script>
  <script src="services/dondeAhorrarFactory.js"></script>
  <script src="services/ahorroFactory.js"></script>
  <script src="services/propietarioUnicoUbicacionesFactory.js"></script>
  <script src="services/controlDeudaFactory.js"></script>
  <script src="services/authService.js"></script>
  <script src="services/alertas.service.js"></script>

  <!-- ✅ Configuración global -->
  <script>
    fetch('config.json')
      .then(response => response.json())
      .then(data => {
        angular.module('ahorrosApp')
          .constant('API_URL', data.API_URL);
        angular.bootstrap(document, ['ahorrosApp']);
      })
      .catch(err => console.error('Error cargando config.json', err));
  </script>

</body>
</html>
