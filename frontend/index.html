<!DOCTYPE html>
<html lang="es" ng-app="ahorrosApp">
<head>
  <meta charset="UTF-8">
  <title>Finanzas Ahorro</title>

  <!-- Bootstrap -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<!-- AngularJS base -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<!-- AngularJS módulos adicionales -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-resource.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.29/angular-ui-router.min.js"></script>


<!-- Angular UI Bootstrap -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/2.5.6/ui-bootstrap-tpls.min.js"></script>

<!-- Tu app -->
<script src="app.js"></script>

  <style>
    body {
      margin: 0;
      padding-top: 56px; /* Altura del navbar superior */
      overflow-x: hidden;
    }

    /* ===== NAVBAR SUPERIOR ===== */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 56px; /* Debajo del navbar */
      left: 0;
      height: 100%;
      width: 230px;
      background-color: #343a40;
      padding-top: 10px;
      transition: width 0.3s ease;
      overflow-x: hidden;
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      display: block;
      padding: 10px 15px;
      font-size: 16px;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      background-color: #495057;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .sidebar.collapsed a span {
      display: none;
    }

    /* ===== CONTENIDO ===== */
    .content {
      margin-left: 230px;
      padding: 20px;
      transition: margin-left 0.3s ease;
    }

    .content.collapsed {
      margin-left: 60px;
    }
  </style>
</head>
<body>

  <!-- Navbar superior -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light me-2" id="toggleBtn">
        <i class="fa fa-bars"></i>
      </button>
      <a class="navbar-brand" href="#">💰 Finanzas Ahorro</a>
    </div>
  </nav>

  <!-- Sidebar lateral -->
  <div class="sidebar" id="sidebar">
    <a ui-sref="principal"><i class="fa fa-home"></i> <span>Inicio</span></a>
    <a ui-sref="trabajo"><i class="fa fa-briefcase"></i> <span>Trabajo</span></a>
    <a ui-sref="propietario"><i class="fa fa-users"></i> <span>Propietarios y Cuentas</span></a>
    <a ui-sref="ubicacion_dinero"><i class="fa fa-university"></i> <span>Ubicación del dinero</span></a>

    <a ui-sref="trabajo"><i class="fa fa-briefcase"></i> <span>Propietario y Cuentas</span></a>
    <a ui-sref="trabajo"><i class="fa fa-briefcase"></i> <span>Ubicacion del dinero</span></a>
  </div>

  <!-- Contenido principal -->
  <div class="content" id="content">
    <div ui-view></div>
  </div>

  <!-- Bootstrap JS -->

  <!-- Script para colapsar sidebar -->
  <script>
    document.getElementById('toggleBtn').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('content').classList.toggle('collapsed');
    });
  </script>

  <!-- Tu lógica Angular -->
  <script src="app.js"></script>


  <!--Controllers-->
  <script src="controllers/ubicacionDineroCtrl.js"></script>
  <script src="controllers/categoriaCtrl.js"></script>
  <script src="controllers/propietarioCtrl.js"></script>

  <!--Factorys-->
  <script src="services/ubicacionDineroFactory.js"></script>
  <script src="services/categoriaFactory.js"></script>
  <script src="services/propietarioFactory.js"></script>


</body>
</html>
