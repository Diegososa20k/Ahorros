<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Finanzas Ahorro</title>

  <!-- ✅ Bootstrap y jQuery (orden correcto) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <!-- ✅ FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- ✅ AngularJS base -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

  <!-- ✅ AngularJS módulos adicionales -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-resource.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.29/angular-ui-router.min.js"></script>

  <!-- ✅ Angular UI Bootstrap -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/2.5.6/ui-bootstrap-tpls.min.js"></script>

  <!-- ✅ Tu app principal -->
  <script src="app.js"></script>
  <!-- Alertas  -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<style>
  /* Hace que el container del navbar use flex (centra verticalmente los hijos) */
#topbar .container-fluid {
  display: flex;
  align-items: center;       /* centra verticalmente */
  justify-content: space-between; /* botón a la izquierda, marca a la derecha */
  padding: 0 12px;           /* espacio horizontal */
  height: 50px;              /* uniformiza la altura del navbar */
}

/* Botón más pequeño y centrado */
#toggleBtn {
  width: 36px;               /* ancho fijo */
  height: 36px;              /* alto fijo */
  padding: 6px;              /* espacio interior */
  font-size: 16px;           /* icono más pequeño */
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;   /* centra el icono dentro del botón */
  border-radius: 4px;
  margin: 0;                 /* eliminar márgenes extra */
}

/* Ajuste del icono (opcional) para que quede nítido */
#toggleBtn .fa {
  font-size: 16px;
}

/* Marca pegada al borde derecho */
#topbar .navbar-brand {
  margin: 0;                 /* elimina márgenes incorrectos */
  padding: 0 8px;
  white-space: nowrap;
  order: 3;       /* manda el texto totalmente a la derecha */
  
  display: flex;             /* <-- esto permite centrar verticalmente */
  align-items: center;       /* <-- centra verticalmente en el navbar */
  height: 50px;              /* misma altura del navbar */
}

/* Asegurar que el botón quede a la izquierda */
#topbar .btn {
  order: -2;
}

/* Si quieres que en móviles el botón se vea un poco más grande */
@media (max-width: 480px) {
  #toggleBtn {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}


  body {
    margin: 0;
    padding-top: 56px; /* Altura del navbar superior */
    overflow-x: hidden;
  }

  /* ===== NAVBAR SUPERIOR ===== */
  #topbar {
    background-color: #212529 !important;
    border: none !important;
  }

  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    position: fixed;
    top: 40px; /* Debajo del navbar */
    left: 0;
    height: 100%;
    width: 230px;
    background-color: #212529 !important;
    padding-top: 10px;
    transition: width 0.3s ease;
    overflow-x: hidden;
  }

  .sidebar a {
    color: #fff;
    text-decoration: none;
    display: block;
    padding: 10px 15px;
    font-size: 16px;
    transition: background 0.3s;
  }

  .sidebar a:hover {
    background-color: #495057;
  }

  /* Sidebar colapsado */
  .sidebar.collapsed {
    width: 60px;
  }

  .sidebar.collapsed a span {
    display: none;
  }

  /* ===== CONTENIDO ===== */
  .content {
    margin-left: 230px;
    padding: 20px;
    transition: margin-left 0.3s ease;
  }

  .content.collapsed {
    margin-left: 60px;
  }
</style>

</head>
<body>

 <!-- ===== NAVBAR SUPERIOR ===== -->
<nav class="navbar" id="topbar" ng-show="mostrarLayout">
  <div class="container-fluid">
    <button class="btn btn-outline-light me-2" id="toggleBtn">
      <i class="fa fa-bars"></i>
    </button>
    <a class="navbar-brand" href="#">💰 Finanzas Ahorro</a>

     <button class="btn btn-danger btn-sm" ng-click="logout()" ng-if="mostrarLayout" style="margin-left:auto;">
        <i class="fa fa-sign-out"></i> Salir
      </button>
  </div>
</nav>

<!-- ===== SIDEBAR LATERAL ===== -->
<div class="sidebar" id="sidebar" ng-show="mostrarLayout">
  <a ui-sref="principal"><i class="fa fa-home"></i> <span>Inicio</span></a>
  <a ui-sref="ahorro"><i class="fa fa-university"></i> <span>Control Ahorro-Gastos</span></a>
  <a ui-sref="propietario"><i class="fa fa-users"></i> <span>Propietarios y Cuentas</span></a>
  <a ui-sref="ubicacion_dinero"><i class="fa fa-university"></i> <span>Ubicación del dinero</span></a>
  <a ui-sref="control_deuda"><i class="fa fa-university"></i> <span>Control de deudas</span></a>
</div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="content" id="content" >
    <div ui-view></div>
  </div>

  <!-- ===== Script para colapsar sidebar ===== -->
<script>
  document.getElementById("toggleBtn").addEventListener("click", function () {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.querySelector(".content").classList.toggle("collapsed");
  });
</script>


  <!-- ===== Controllers ===== -->
  <script src="controllers/principalCtrl.js"></script>
  <script src="controllers/ubicacionDineroCtrl.js"></script>
  <script src="controllers/propietarioCtrl.js"></script>
  <script src="controllers/propietarioUnicoCtrl.js"></script>
  <script src="controllers/dondeAhorrarCtrl.js"></script>
  <script src="controllers/ahorroCtrl.js"></script>
  <script src="controllers/controlDeudaCtrl.js"></script>
  <script src="controllers/loginCtrl.js"></script>
  <script src="controllers/registerCtrl.js"></script>

  <!-- ===== Services / Factories ===== -->
  <script src="services/ubicacionDineroFactory.js"></script>
  <script src="services/categoriaFactory.js"></script>
  <script src="services/propietarioFactory.js"></script>
  <script src="services/propietarioUnicoFactory.js"></script>
  <script src="services/dondeAhorrarFactory.js"></script>
  <script src="services/ahorroFactory.js"></script>
  <script src="services/propietarioUnicoUbicacionesFactory.js"></script>
  <script src="services/controlDeudaFactory.js"></script>
  <script src="services/authService.js"></script>

  <script src="services/alertas.service.js"></script>


  <!-- ✅ Configuración global (se carga al final) -->
  <script>
    fetch('config.json')
      .then(response => response.json())
      .then(data => {
        // Crear la constante API_URL desde config.json
        angular.module('ahorrosApp')
          .constant('API_URL', data.API_URL);
        // Inicializa Angular manualmente
        angular.bootstrap(document, ['ahorrosApp']);
      })
      .catch(err => console.error('Error cargando config.json', err));
  </script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
