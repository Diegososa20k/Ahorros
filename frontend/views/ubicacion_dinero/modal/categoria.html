<div class="modal-header" style="background: linear-gradient(135deg, var(--secondary-finance) 0%, #0891b2 100%); border: none; padding: 20px 24px; position: relative;">
  <button type="button" class="close" ng-click="cancelar()" 
          style="position: absolute; right: 20px; top: 20px; color: white; opacity: 0.9; font-size: 28px; font-weight: 300; text-shadow: none;">
    &times;
  </button>
  <h3 class="modal-title" style="color: white; font-weight: 600; font-size: 20px; margin: 0; display: flex; align-items: center;">
    <i class="fa fa-tags" style="margin-right: 10px;"></i>
    Categorías
  </h3>
</div>

<div class="modal-body" style="padding: 24px;">
  <div ng-if="editando" 
       style="padding: 12px 16px; margin-bottom: 20px; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 8px; border-left: 4px solid var(--warning-finance); box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);">
    <div style="display: flex; align-items: center; color: #92400e;">
      <i class="fa fa-pencil" style="margin-right: 10px; font-size: 16px;"></i>
      <span style="font-weight: 600; font-size: 14px;">Estás editando una categoría existente</span>
    </div>
  </div>

  <!-- FORMULARIO -->
  <div style="background: white; border-radius: 8px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid var(--secondary-finance);">
    <div class="form-group" style="margin-bottom: 16px;">
      <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
        Nombre de la categoría
      </label>
      <input type="text"
             class="form-control input-categoria"
             ng-class="{ 'input-editando': editando }"
             placeholder="Ej: Banco, Efectivo, App Mobile"
             ng-model="categoriaForm.nombre">
    </div>
  </div>

  <hr style="border: none; border-top: 2px solid #e5e7eb; margin: 24px 0;">

  <!-- TABLA -->
  <div class="movements-panel">
    <h4 style="margin: 0 0 16px 0; color: var(--dark-finance); font-weight: 600; font-size: 16px; display: flex; align-items: center;">
      <i class="fa fa-list" style="margin-right: 8px; color: var(--secondary-finance);"></i>
      Categorías registradas
    </h4>

    <div class="table-responsive" ng-if="categorias.length" style="overflow-x: auto; overflow-y: hidden;">
      <table class="table table-bordered table-striped" style="margin-bottom: 0;">
        <thead>
          <tr style="background: linear-gradient(135deg, var(--secondary-finance), #0891b2); color: white;">
            <th style="border: none; padding: 14px 12px; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">
              <i class="fa fa-tag" style="margin-right: 6px;"></i>
              Nombre
            </th>
            <th style="border: none; width:120px; padding: 14px 12px; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">
              <i class="fa fa-cog" style="margin-right: 6px;"></i>
              Acciones
            </th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="c in categorias" class="fila-tabla-hover-cat">
            <td style="border: 1px solid #e5e7eb; padding: 12px; vertical-align: middle; font-weight: 500;">
              {{ c.nombre }}
            </td>
            <td class="cell-center-multi" style="border: 1px solid #e5e7eb; padding: 12px; vertical-align: middle;">
              <div class="icon-row">
                <div class="icon-circle-abono"   
                    uib-tooltip="Editar"
                    ng-click="editar(c)">
                    <i class="fa fa-pencil"></i>
                </div>

                <div class="icon-circle-eliminar"
                    uib-tooltip="Eliminar categoría"
                    ng-click="eliminar(c.id)">
                    <i class="fa fa-trash"></i>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div ng-if="!categorias.length" 
         style="text-align: center; color: #9ca3af; padding: 40px;">
      <i class="fa fa-inbox" style="font-size: 48px; margin-bottom: 16px; display: block; opacity: 0.5;"></i>
      <p style="font-size: 16px; font-weight: 500; margin: 0;">No hay categorías registradas.</p>
    </div>
  </div>

</div>

<div class="modal-footer" style="background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 16px 24px;">
  <button class="btn-categoria btn-categoria-default" ng-click="cancelar()">
    <i class="fa fa-times"></i> Cerrar
  </button>

  <button class="btn-categoria btn-categoria-primary" ng-click="guardarCategoria()">
    <i class="fa fa-save"></i> Guardar
  </button>
</div>

<style>
/* Estilos para inputs del formulario de categorías */
.input-categoria {
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 14px;
  transition: all 0.2s ease;
  height: 40px;
  line-height: 1.5;
}

.input-categoria:focus {
  border-color: var(--secondary-finance);
  box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
  outline: none;
}

.input-categoria:hover {
  border-color: #9ca3af;
}

/* Estado de edición */
.input-editando {
  border-color: var(--warning-finance) !important;
  background-color: #fffbeb;
}

.input-editando:focus {
  border-color: var(--warning-finance) !important;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1) !important;
}

/* Botones del modal de categorías */
.btn-categoria {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-left: 8px;
}

.btn-categoria:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
}

.btn-categoria:active {
  transform: translateY(0);
}

.btn-categoria-default {
  background: white;
  color: #6b7280;
  border: 1px solid #d1d5db;
}

.btn-categoria-default:hover {
  background: #f9fafb;
  border-color: #9ca3af;
}

.btn-categoria-primary {
  background: linear-gradient(135deg, var(--secondary-finance), #0891b2);
  color: white;
}

.btn-categoria-primary:hover {
  background: linear-gradient(135deg, #0891b2, var(--secondary-finance));
}

/* Hover para filas de la tabla */
.fila-tabla-hover-cat {
  transition: all 0.2s ease;
}

.fila-tabla-hover-cat:hover {
  background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%) !important;
  box-shadow: 0 2px 8px rgba(6, 182, 212, 0.1);
}

.fila-tabla-hover-cat:hover td {
  border-color: #a5f3fc !important;
}

/* Estilos para tabla */
.table-bordered {
  border: 1px solid #e5e7eb;
}

.table-striped tbody tr:nth-of-type(odd) {
  background-color: rgba(249, 250, 251, 0.5);
}

.table-striped tbody tr:hover {
  background-color: rgba(6, 182, 212, 0.05);
  transition: background-color 0.2s ease;
}

/* Botón cerrar del header */
.close:hover {
  opacity: 1 !important;
}
</style>
