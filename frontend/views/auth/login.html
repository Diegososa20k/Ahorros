<div class="container" style="margin-top: 50px; max-width: 400px;">
  <div class="panel panel-default">
    <div class="panel-heading">
      <h3 class="panel-title">Iniciar sesión</h3>
    </div>

    <div class="panel-body">
      <form ng-submit="login()">
        
        <div class="form-group">
          <label>Correo</label>
          <input type="email" ng-model="form.email" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" ng-model="form.password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>

        <div class="text-center" style="margin-top:10px;" ng-if="error">
          <p class="text-danger">{{ error }}</p>
        </div>

      </form>

      <!-- 🆕 BOTÓN PARA IR A REGISTRO -->
      <hr>
      <div class="text-center">
        <p>¿No tienes cuenta?</p>
        <button type="button" class="btn btn-success btn-block" ui-sref="register">
          <i class="fa fa-user-plus"></i> Crear Cuenta
        </button>
      </div>

    </div>
  </div>
</div>
