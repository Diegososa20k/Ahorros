<div class="p-6">
  <h1 class="text-2xl font-bold mb-6 text-gray-800">Ahorro del trabajo</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad para ahorrar</label>
      <input type="number" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" placeholder="Ej. 5000" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de depósito</label>
      <input type="date" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación del dinero</label>
      <select class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
        <option value="">Selecciona una ubicación</option>
        <option value="banco">Banco</option>
        <option value="efectivo">Efectivo</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Propietario</label>
      <select class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
        <option value="">Selecciona propietario</option>
        <option value="mirtur">Mirtur</option>
        <option value="quirmo">Quirmo</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Cajita o cuenta</label>
      <select class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
        <option value="">Selecciona una opción</option>
        <option value="cajita">Cajita</option>
        <option value="cuenta">Cuenta</option>
      </select>
    </div>

    <div class="md:col-span-2 lg:col-span-3">
      <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
      <textarea class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" rows="3" placeholder="Detalles o comentarios..."></textarea>
    </div>
  </div>

  <div class="flex items-center gap-3 mb-6">
    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Guardar</button>
    <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">Gastos</button>
  </div>

  <div class="mb-4">
    <input type="text" placeholder="Buscar ahorro..." class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" />
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full border border-gray-200 rounded-lg">
      <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="px-4 py-2 text-left">Cantidad</th>
          <th class="px-4 py-2 text-left">Fecha</th>
          <th class="px-4 py-2 text-left">Ubicación</th>
          <th class="px-4 py-2 text-left">Propietario</th>
          <th class="px-4 py-2 text-left">Cajita/Cuenta</th>
          <th class="px-4 py-2 text-left">Descripción</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr>
          <td class="px-4 py-2">5000</td>
          <td class="px-4 py-2">2025-11-07</td>
          <td class="px-4 py-2">Banco</td>
          <td class="px-4 py-2">Mirtur</td>
          <td class="px-4 py-2">Cuenta</td>
          <td class="px-4 py-2">Primer ahorro del mes</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
