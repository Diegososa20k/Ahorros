<div class="modal-header" style="background: linear-gradient(135deg, var(--danger-finance) 0%, #a01515 100%); border: none; padding: 20px 24px;">
  <h3 class="modal-title" style="color: white; font-weight: 600; font-size: 20px; margin: 0; display: flex; align-items: center;">
    <i class="fa fa-minus-circle" style="margin-right: 10px;"></i>
    Registrar gasto
  </h3>
</div>

<div class="modal-body" style="padding: 24px;">
  <form name="formGasto" novalidate>

    <div class="row">
      <div class="col-md-4">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Cantidad
        </label>
        <input type="number" step="0.01" ng-model="nuevoGasto.cantidad_gasto"
               class="form-control input-gasto" placeholder="Ej. 1500.00" required>
      </div>

      <div class="col-md-4">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Fecha del gasto
        </label>
        <input type="date" ng-model="nuevoGasto.fecha_gasto"
               class="form-control input-gasto" required>
      </div>

      <div class="col-md-4">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Descripción
        </label>
        <input type="text" ng-model="nuevoGasto.descripcion"
               class="form-control input-gasto" placeholder="Opcional">
      </div>
    </div>

    <div class="row" style="margin-top: 16px;">
      <div class="col-md-4">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Propietario
        </label>
        <select ng-model="nuevoGasto.propietario_id"
                ng-options="p.propietario_id as p.propietario_unico.nombre for p in propietarios"
                class="form-control input-gasto" required>
          <option value="">-- Selecciona propietario --</option>
        </select>
      </div>

      <div class="col-md-4">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Ubicación del dinero
        </label>
        <select ng-model="nuevoGasto.ubicacion_id"
                ng-options="u.id as u.nombre for u in ubicacionesFiltradas"
                class="form-control input-gasto" required>
          <option value="">-- Selecciona ubicación --</option>
        </select>
      </div>

      <div class="col-md-4" ng-if="mostrarCajitasGasto">
        <label style="font-weight: 500; color: #374151; margin-bottom: 6px; display: block; font-size: 14px;">
          Cajita / Subcuenta
        </label>
        <select ng-model="nuevoGasto.cajita_subcuenta"
                ng-options="c for c in cajitasPropietarioGasto"
                class="form-control input-gasto">
          <option value="">-- Selecciona cajita o subcuenta --</option>
        </select>
      </div>
    </div>

  </form>
</div>

<div class="modal-footer" style="background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 16px 24px;">
  <button class="btn-gasto btn-gasto-default" ng-click="cancelar()">
    <i class="fa fa-times"></i> Cancelar
  </button>
  <button class="btn-gasto btn-gasto-danger" ng-click="guardarGasto()" ng-disabled="formGasto.$invalid">
    <i class="fa fa-save"></i> Guardar gasto
  </button>
</div>

<style>

  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 14px;
  transition: all 0.2s ease;
  height: 40px;
  line-height: 1.5;
}

.input-gasto:focus {
  border-color: var(--danger-finance);
  box-shadow: 0 0 0 3px rgba(239, 71, 111, 0.1);
  outline: none;
}

.input-gasto:hover {
  border-color: #9ca3af;
}

  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 16px;
  padding-right: 35px;
  padding-top: 8px;
  padding-bottom: 8px;
}

.btn-gasto {
  padding: 10px 18px;

  font-size: 14px;
